description: Loyal (Cellular Longevity, Inc., loyalfordogs.com redirects to loyal.com) is a San
  Francisco biotech developing longevity drugs for dogs that target the underlying processes of aging
  to extend healthy lifespan in senior dogs. Its lead candidate, LOY-002, targets metabolic
  dysfunction in dogs aged ten and older and is progressing through FDA approval. The company serves
  veterinary professionals and dog owners with clinical and care resources and runs clinical trials;
  it publishes no developer API, documentation, SDKs, or public code repositories. Surfaced as a
  portfolio company of Khosla Ventures and added to the API Evangelist network.
